apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: <ecr-backend-image>
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "<rds-endpoint>"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASS
          value: "yourpassword"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
