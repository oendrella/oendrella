apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: 388370472854.dkr.ecr.us-east-1.amazonaws.com/my-app:latest
        ports:
        - containerPort: 8080
        livenessProbe: 
          httpGet:
           path: /healthz
           port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        
